services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prefect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3.7.8-python3.13
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1/prefect
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_API_URL: "http://127.0.0.1:4200/api"
      PREFECT_UI_URL: "http://127.0.0.1:4200/api"
      PREFECT_API_REQUEST_TIMEOUT: "120"
      PREFECT_RUNNER_HEARTBEAT_FREQUENCY: "120"
      PREFECT_TASKS_REFRESH_CACHE: "true"
      PREFECT_WORKER_HEARTBEAT_SECONDS: "60"
      PREFECT_API_DATABASE_CONNECTION_TIMEOUT: "10"
    command: prefect server start
    ports:
      - "4200:4200"
    healthcheck:
      test: [
        "CMD", 
        "python", 
        "-c", 
        "import urllib.request as u; u.urlopen('http://127.0.0.1:4200/api/health', timeout=1)", 
        "apt-key"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - prefect-network

  worker-pool-1-local:
    build: .
    image: prefecthq/prefect:3.7.8-python3.13
    container_name: prefect-local-worker-pool
    command: prefect worker start --pool "WORKER-1" --name "WORKER-1-LOCAL"
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://127.0.0.1:4200/api
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - prefect-network
    
  ###########################################################################

volumes:
  postgres_data:
  
networks:
  prefect-network:
    driver: bridge